name: chiniot_power_hse
description: Chiniot Power Limited (CPL) HSE Management System - Cross-platform Flutter Application
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking & HTTP
  dio: ^5.4.0

  # Storage & Caching
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Typography & Charts
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  qr_flutter: ^4.1.0

  # Hardware, Sensors & Media (with desktop fallbacks)
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.0.0

  # Utilities & Generation
  intl: ^0.19.0
  uuid: ^4.3.3
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.12.0

  # UI & Presentation
  cupertino_icons: ^1.0.6
  record: ^7.2.0
  local_auth: ^3.0.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/audio/
